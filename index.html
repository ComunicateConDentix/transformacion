<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c0049">
  <meta name="description" content="Experiencia interactiva Clikea para impulsar la transformacion tecnologica.">
  <title>Clikea | Transformacion tecnologica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Etapas del recorrido">
      <div class="burger" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="tiles">
        <img src="img/icono1.png" alt="Etapa inicial" width="256" height="256">
        <img src="img/icono2.png" alt="Etapa de progreso" width="256" height="256">
        <img src="img/icono3.png" alt="Etapa de pausa" width="256" height="256">
        <img src="img/icono4.png" alt="Etapa final" width="256" height="256">
      </div>
    </aside>

    <div class="barwrap" aria-label="Progreso de la actividad">
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
        <div class="fill" id="fill"></div>
      </div>
    </div>

    <main class="main">
      <!-- NUEVO: Espacio para el Logo en la esquina superior -->
      <div class="logo-container">
        <!-- Reemplaza el span por tu imagen: <img src="img/Logo-dentix-blanco.png" alt="Logo Clikea"> -->
        <span><img src="img/Logo-dentix-blanco.png" alt="Dentix"></span>
      </div>

      <section class="copy" aria-live="polite">
        <h1 id="h1"></h1>
        <div class="brand" id="brand"></div>
        <p class="sub" id="sub"></p>
      </section>

      <div class="stage" id="stage">
        <img id="tooth" src="img/muela1.png" alt="Mascota de Clikea" width="380" height="390">
      </div>

      <button class="key" id="key" type="button" aria-label="Haz clic varias veces para llenar la barra">
        <span class="in">
          <span class="top" id="top"></span>
          <b>haz clic</b>
          <span class="low">Varias veces</span>
        </span>
       <span class="hand" aria-hidden="true">
  <svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.04.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.21 0-.69-.47-1.26-1.1-1.37z"/>
  </svg>
</span>
      </button>

      <section class="win" id="win" hidden aria-live="polite">
        <div class="cta">
          <a class="pill" id="link" href="#" target="_blank" rel="noopener noreferrer">
            Clic para
            <small>ser parte de la transformacion</small>
          </a>
          <p>Escribe tu nombre en el enlace y espera la sorpresa que <em>te facilitara tu trabajo.</em></p>
        </div>
        <button class="again" id="again" type="button">Volver a jugar</button>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
